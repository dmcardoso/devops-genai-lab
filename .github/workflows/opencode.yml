name: OpenCode CI & Review

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  id-token: write
  contents: write
  pull-requests: write
  issues: write

jobs:
  unit_test:
    name: Unit Tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests (intentional failure)
        run: |
          echo "Rodando testes unitários..."
          pytest test_app.py

  ai_debugger:
    name: OpenCode AI Debugger
    needs: [unit_test]
    if: always() && needs.unit_test.result == 'failure'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Configure Git identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Sign in to OpenCode
        env:
          AUDIENCE: https://opencode.ai/console
        run: |
          oidc=$(curl -sSf --oauth2-bearer "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$AUDIENCE" | jq -r .value)
          token=$(curl -sSf https://opencode.ai/console/auth/oauth/token \
            -d grant_type=urn:ietf:params:oauth:grant-type:token-exchange \
            -d subject_token_type=urn:ietf:params:oauth:token-type:jwt \
            -d client_id=sk_af7c6e65-a88d-46ca-ba7d-74da0bbcc82f \
            -d subject_token="$oidc" | jq -r .access_token)
          echo "::add-mask::$token"
          echo "OPENCODE_API_KEY=$token" >> "$GITHUB_ENV"

      - name: Cache opencode
        id: cache
        uses: actions/cache@v4
        with:
          path: ~/.opencode/bin
          key: opencode-${{ runner.os }}-${{ runner.arch }}-v1.19.5

      - name: Install opencode
        if: steps.cache.outputs.cache-hit != 'true'
        run: curl -fsSL https://opencode.ai/install | bash -s -- --version 1.19.5

      - name: Run OpenCode Review
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_EVENT_NAME: pull_request
          MODEL: opencode-go/claude-haiku-5-5
          USE_GITHUB_TOKEN: "true"
          OPENCODE_PERMISSION: '{"edit":"deny","write":"deny","bash":"allow"}'
          PROMPT: |
            Você é um Engenheiro DevOps Sênior especialista em Python.
            O job `unit_test` falhou ao executar `pytest test_app.py` nesta Pull Request.
            Execute `pytest test_app.py` ou analise os arquivos `app.py` e `test_app.py` neste repositório.
            NÃO edite nenhum arquivo. Responda diretamente em português com um diagnóstico completo:
            1. Identifique a causa raiz da falha nos testes unitários.
            2. Mostre a sugestão exata de correção do código em `app.py`.
            3. Seja breve, técnico e didático.
        run: ~/.opencode/bin/opencode github run
