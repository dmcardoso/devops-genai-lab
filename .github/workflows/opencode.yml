name: OpenCode CI & Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  id-token: write
  contents: read
  pull-requests: write
  issues: write

jobs:
  review:
    if: |
      github.event_name == 'pull_request' ||
      contains(github.event.comment.body, '/oc') ||
      contains(github.event.comment.body, '/opencode')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        id: unit_test
        continue-on-error: true
        run: |
          echo "Rodando testes unitários..."
          pytest test_app.py 2>&1 | tee pytest_output.log
          exit ${PIPESTATUS[0]}

      - name: Sign in to OpenCode
        env:
          AUDIENCE: https://opencode.ai/console
        run: |
          oidc=$(curl -sSf --oauth2-bearer "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$AUDIENCE" | jq -r .value)
          echo "OIDC claims:"
          echo "$oidc" | cut -d. -f2 | base64 -d 2>/dev/null | jq '{iss, sub, aud, ref, repository, event_name, workflow_ref, job_workflow_ref}' || true
          resp=$(curl -sS https://opencode.ai/console/auth/oauth/token \
            -d grant_type=urn:ietf:params:oauth:grant-type:token-exchange \
            -d subject_token_type=urn:ietf:params:oauth:token-type:jwt \
            -d client_id=sk_af7c6e65-a88d-46ca-ba7d-74da0bbcc82f \
            -d subject_token="$oidc")
          token=$(echo "$resp" | jq -r '.access_token // empty')
          if [ -z "$token" ]; then
            echo "OAuth token exchange failed: $resp"
            exit 1
          fi
          echo "::add-mask::$token"
          echo "OPENCODE_API_KEY=$token" >> "$GITHUB_ENV"

      - name: Run OpenCode Review
        uses: anomalyco/opencode/github@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: opencode-go/claude-haiku-5-5
          use_github_token: true
          prompt: |
            Você é um Engenheiro DevOps Sênior especialista em Python.
            Revise esta Pull Request e analise o log de erro dos testes unitários salvo em `pytest_output.log` (ou execute `pytest test_app.py`).
            1. Identifique a causa raiz da falha nos testes (`app.py` e `test_app.py`).
            2. Sugira a correção exata do código com um exemplo claro.
            3. Seja breve, técnico e didático, respondendo em português.
