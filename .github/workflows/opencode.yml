name: OpenCode CI & Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  id-token: write
  contents: read
  pull-requests: write
  issues: write

jobs:
  unit_test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests (pytest)
        run: |
          echo "Rodando testes unitários..."
          pytest test_app.py

  opencode:
    if: |
      contains(github.event.comment.body, '/oc') ||
      contains(github.event.comment.body, '/opencode')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Configure Git identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Capture unit test failure log
        continue-on-error: true
        run: |
          echo "Rodando testes unitários para captura de log..."
          pytest test_app.py 2>&1 | tee /tmp/pytest_output.log
          exit ${PIPESTATUS[0]}

      - name: Sign in to OpenCode
        env:
          AUDIENCE: https://opencode.ai/console
        run: |
          oidc=$(curl -sSf --oauth2-bearer "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$AUDIENCE" | jq -r .value)
          token=$(curl -sSf https://opencode.ai/console/auth/oauth/token \
            -d grant_type=urn:ietf:params:oauth:grant-type:token-exchange \
            -d subject_token_type=urn:ietf:params:oauth:token-type:jwt \
            -d client_id=sk_af7c6e65-a88d-46ca-ba7d-74da0bbcc82f \
            -d subject_token="$oidc" | jq -r .access_token)
          echo "::add-mask::$token"
          echo "OPENCODE_API_KEY=$token" >> "$GITHUB_ENV"

      - name: Run OpenCode Review
        uses: anomalyco/opencode/github@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: opencode-go/claude-haiku-5-5
          agent: plan
          use_github_token: true
          prompt: |
            Você é um Engenheiro DevOps Sênior especialista em Python.
            Analise o código do repositório (`app.py` e `test_app.py`) e o log de erro dos testes unitários salvo em `/tmp/pytest_output.log`.
            NÃO altere nenhum arquivo do repositório; apenas escreva o diagnóstico completo na resposta:
            1. Identifique a causa raiz da falha nos testes.
            2. Sugira a correção exata do código com um bloco de código de exemplo.
            3. Seja breve, técnico e didático, respondendo em português.
